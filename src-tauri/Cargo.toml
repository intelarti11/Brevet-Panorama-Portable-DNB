[package]
name = "brevet-panorama-portable"
version = "0.1.4"
description = "Application locale Brevet Panorama"
license = "AGPL-3.0-or-later"
repository = "https://github.com/intelarti11/Brevet-Panorama-Portable-DNB"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "brevet_panorama_portable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "brevet-panorama-portable"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
